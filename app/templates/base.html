<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Runzo 测试执行平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body>
    {% block content %}{% endblock %}
    <script>
      let logScrollState = null;

      function updateTaskActionButtons() {
        const metadata = document.getElementById("task-status-metadata");
        const continueButton = document.getElementById("continue-task-button");
        const cancelButton = document.getElementById("cancel-task-button");
        if (!metadata || !continueButton || !cancelButton) {
          return;
        }
        const currentStatus = metadata.getAttribute("data-task-status") || "";
        const taskId = metadata.getAttribute("data-task-id") || "";
        continueButton.disabled = currentStatus !== "等待确认";
        cancelButton.disabled = !taskId || ["已完成", "已失败", "已终止"].includes(currentStatus);
      }

      function rememberLogScrollState() {
        const logContainer = document.getElementById("log-scroll-container");
        if (!logContainer) {
          logScrollState = null;
          return;
        }
        logScrollState = {
          scrollTop: logContainer.scrollTop,
          scrollHeight: logContainer.scrollHeight,
          isPinnedToTop: logContainer.scrollTop <= 24,
        };
      }

      function restoreLogScrollState() {
        const logContainer = document.getElementById("log-scroll-container");
        if (!logContainer || !logScrollState) {
          return;
        }
        if (logScrollState.isPinnedToTop) {
          logContainer.scrollTop = 0;
          return;
        }
        const heightDelta = logContainer.scrollHeight - logScrollState.scrollHeight;
        logContainer.scrollTop = Math.max(logScrollState.scrollTop + heightDelta, 0);
      }

      async function copyTextContent(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const tempTextarea = document.createElement("textarea");
        tempTextarea.value = text;
        tempTextarea.setAttribute("readonly", "true");
        tempTextarea.style.position = "fixed";
        tempTextarea.style.opacity = "0";
        document.body.appendChild(tempTextarea);
        tempTextarea.select();
        document.execCommand("copy");
        document.body.removeChild(tempTextarea);
      }

      function updateCopyButtonLabel(button, label) {
        const originalLabel = button.dataset.originalLabel || button.textContent || "复制内容";
        button.dataset.originalLabel = originalLabel;
        button.textContent = label;
        window.setTimeout(() => {
          button.textContent = button.dataset.originalLabel || "复制内容";
        }, 1500);
      }

      function getFormCacheKey(form) {
        return form?.getAttribute("data-form-cache-key") || "";
      }

      function getCacheableFormFields(form) {
        return Array.from(form.elements || []).filter((element) => {
          if (!element || !element.name || element.disabled) {
            return false;
          }
          return ["INPUT", "TEXTAREA", "SELECT"].includes(element.tagName);
        });
      }

      function saveFormCache(form) {
        const cacheKey = getFormCacheKey(form);
        if (!cacheKey) {
          return;
        }
        const cacheData = {};
        getCacheableFormFields(form).forEach((element) => {
          if (element.type === "checkbox") {
            cacheData[element.name] = element.checked;
            return;
          }
          if (element.type === "radio") {
            if (element.checked) {
              cacheData[element.name] = element.value;
            }
            return;
          }
          cacheData[element.name] = element.value;
        });
        sessionStorage.setItem(cacheKey, JSON.stringify(cacheData));
      }

      function restoreFormCache(form) {
        const cacheKey = getFormCacheKey(form);
        if (!cacheKey) {
          return;
        }
        const rawData = sessionStorage.getItem(cacheKey);
        if (!rawData) {
          return;
        }
        let cacheData = null;
        try {
          cacheData = JSON.parse(rawData);
        } catch {
          sessionStorage.removeItem(cacheKey);
          return;
        }
        getCacheableFormFields(form).forEach((element) => {
          if (!(element.name in cacheData)) {
            return;
          }
          const fieldValue = cacheData[element.name];
          if (element.type === "checkbox") {
            element.checked = Boolean(fieldValue);
            return;
          }
          if (element.type === "radio") {
            element.checked = element.value === fieldValue;
            return;
          }
          element.value = fieldValue ?? "";
        });
        form.querySelectorAll("select, input[type='radio'], input[type='checkbox']").forEach((element) => {
          element.dispatchEvent(new Event("change", { bubbles: true }));
        });
      }

      function restoreAllCachedForms() {
        document.querySelectorAll("form[data-form-cache-key]").forEach((form) => {
          restoreFormCache(form);
        });
      }

      document.addEventListener("click", (event) => {
        const toggleTrigger = event.target.closest("[data-toggle-target]");
        if (toggleTrigger) {
          const targetSelector = toggleTrigger.getAttribute("data-toggle-target");
          const target = document.querySelector(targetSelector);
          if (!target) {
            return;
          }
          const isExpanded = toggleTrigger.getAttribute("aria-expanded") === "true";
          toggleTrigger.setAttribute("aria-expanded", String(!isExpanded));
          target.hidden = isExpanded;
          return;
        }

        const copyButton = event.target.closest("[data-copy-source]");
        if (!copyButton) {
          return;
        }
        const sourceElement = document.getElementById(copyButton.getAttribute("data-copy-source") || "");
        if (!sourceElement) {
          updateCopyButtonLabel(copyButton, "复制失败");
          return;
        }
        copyTextContent(sourceElement.textContent || "")
          .then(() => {
            updateCopyButtonLabel(copyButton, "已复制");
          })
          .catch(() => {
            updateCopyButtonLabel(copyButton, "复制失败");
          });
      });

      document.addEventListener("input", (event) => {
        const form = event.target.closest("form[data-form-cache-key]");
        if (form) {
          saveFormCache(form);
        }
      });

      document.addEventListener("change", (event) => {
        const form = event.target.closest("form[data-form-cache-key]");
        if (form) {
          saveFormCache(form);
        }
      });

      document.addEventListener("reset", (event) => {
        const form = event.target.closest("form[data-form-cache-key]");
        if (!form) {
          return;
        }
        const cacheKey = getFormCacheKey(form);
        window.setTimeout(() => {
          sessionStorage.removeItem(cacheKey);
        }, 0);
      });

      document.addEventListener("DOMContentLoaded", () => {
        restoreAllCachedForms();
        updateTaskActionButtons();
      });

      document.body.addEventListener("htmx:beforeRequest", (event) => {
        if (event.target.id === "task-status-data-container") {
          rememberLogScrollState();
        }
      });

      document.body.addEventListener("htmx:afterSwap", (event) => {
        if (event.target.id === "task-status-data-container") {
          updateTaskActionButtons();
          restoreLogScrollState();
        }
      });
    </script>
  </body>
</html>
