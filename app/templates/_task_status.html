<section class="卡片 状态卡片" id="task-status-container">
  <div class="卡片标题区">
    <h2>当前任务状态区</h2>
  </div>
  <div
    class="状态数据容器"
    id="task-status-data-container"
    hx-get="/任务状态片段"
    hx-trigger="load, every 2s"
    hx-swap="innerHTML"
  >
    {% include "_task_status_content.html" %}
  </div>
  <div class="按钮组">
    <button
      id="continue-task-button"
      class="主按钮"
      type="button"
      hx-post="/api/runzo/continue"
      hx-target="#task-status-data-container"
      hx-swap="innerHTML"
      hx-sync="#task-status-data-container:replace"
    >
      继续执行
    </button>
    <button
      id="cancel-task-button"
      class="危险按钮"
      type="button"
      hx-post="/api/runzo/cancel"
      hx-target="#task-status-data-container"
      hx-swap="innerHTML"
      hx-sync="#task-status-data-container:replace"
    >
      终止任务
    </button>
  </div>
</section>
